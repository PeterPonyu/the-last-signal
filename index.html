<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0e0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="An original action adventure across five lands. Plays with keyboard, mouse, touch or gamepad.">
  <title>The Last Signal · Zeyu's Golden Rebellion</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="typography.css">
</head>
<body>
  <section id="landing" class="landing" aria-labelledby="title">
    <header class="masthead">
      <span class="wordmark"><span class="sun-mark" aria-hidden="true">✦</span><span data-i18n="brand">THE LAST SIGNAL</span></span>
      <div class="lang-switch" role="group" data-i18n-aria="lang.label" aria-label="Language"><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="zh" lang="zh-CN">中文</button></div>
    </header>
    <div class="landing-art" aria-hidden="true"><div class="solar-ring"></div><img class="hero-art" src="assets/zeyu-golden.png" alt=""></div>
    <div class="intro">
      <p class="eyebrow" data-i18n="landing.eyebrow">An action adventure starring Zeyu</p>
      <h1 id="title" data-i18n-html="landing.title">Let the world<br>hear your <em>answer.</em></h1>
      <p class="lead" data-i18n="landing.lead">The sun has gone dark. Carry the last light across five lands.</p>
      <div class="start-row"><button id="start" type="button" class="primary" disabled>Loading…</button><p class="facts"><span data-i18n="landing.facts">5 maps · 10 bosses · 35–45 min</span><span data-i18n="landing.devices">Keyboard, mouse, touch or gamepad</span></p></div>
      <nav class="landing-links"><button id="controls-button" type="button" data-i18n="landing.howTo">How to play</button><button id="world-button" type="button" data-i18n="landing.world">The world</button><button id="character-button" type="button" data-i18n="landing.companions">Companions</button></nav>
      <p class="hero-quote"><span data-i18n="landing.quote">“Then I will make a road.”</span> <cite>— Zeyu</cite></p>
    </div>
    <p id="status" class="status-line" role="status"></p>
  </section>

  <section id="game" class="game" hidden aria-label="The Last Signal">
    <header class="topbar">
      <button id="pause-button" type="button" class="icon-button" data-i18n-aria="top.menu" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="stepper" role="group" data-i18n-aria="top.steps" aria-label="Map steps"><span class="step-text"><span id="step-number" class="step-no"></span><span id="campaign-stage" class="stage-name"></span></span><span id="step-pips" class="pips" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>
      <div class="next"><strong id="objective" class="objective"></strong><span id="campaign-progress" class="campaign" hidden><progress id="campaign-meter" max="1" value="0" aria-labelledby="objective"></progress><span id="campaign-count" class="count"></span></span></div>
      <span id="area-label" class="area-label"></span>
      <ol id="route-progress" class="maps" data-i18n-aria="top.maps" aria-label="Map progress"></ol>
      <button id="fullscreen-button" type="button" class="icon-button" data-i18n-aria="top.fullscreen" aria-label="Full screen" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    </header>

    <div id="stage" class="stage">
      <canvas id="arena" tabindex="0" data-i18n-aria="arena.label" aria-label="Battlefield"></canvas>
      <div class="hud">
        <div class="vitals"><div class="vitals-row"><span class="who">ZEYU</span><span id="health-number"></span></div><div class="bar"><span id="health-fill"></span></div><div id="party-status" class="party" aria-live="polite"></div><ol id="party-roster" class="roster" data-i18n-aria="hud.party" aria-label="Party" hidden></ol></div>
        <div class="hud-side">
          <div class="tally"><span id="run-time">0:00</span><span><b id="kills">0</b> <span id="kills-label" data-i18n="hud.freed">freed</span></span></div>
          <div id="rule-chip" class="rule-chip" hidden><span id="rule-icon" class="rule-icon" aria-hidden="true"></span><span class="rule-copy"><span id="rule-name" class="rule-name"></span><span id="rule-phase" class="rule-phase"></span></span></div>
        </div>
      </div>
      <div class="toasts"><p id="story-line" class="toast story" aria-live="polite"></p><p id="banner" class="toast banner" role="status" aria-atomic="true"></p><p id="rotate-hint" class="toast rotate-hint" data-i18n="rotate.hint" hidden></p></div>
      <aside id="field-guide" class="guide" hidden>
        <div class="guide-head"><span id="guidance-symbol" class="guide-symbol" aria-hidden="true"></span><div><p id="guidance-session" class="guide-session"></p><h3 id="guidance-title"></h3></div></div>
        <p id="guidance-copy" class="guide-copy"></p>
        <div class="guide-actions"><button id="guide-legend-button" type="button" data-i18n="guide.symbols">Symbols</button><button id="hide-guidance" type="button" data-i18n="guide.hide">Hide</button></div>
      </aside>
      <div id="boss-hud" class="boss" hidden><span id="boss-name"></span><div class="bar"><span id="boss-fill"></span></div><div id="boss-guard" class="guard" hidden><span id="guard-label"></span><div class="bar"><span id="guard-fill"></span></div></div></div>
    </div>

    <div id="touch-controls" class="touch" data-i18n-aria="touch.label" aria-label="Touch controls">
      <div id="stick-zone" class="stick-zone" data-i18n-aria="touch.stick" aria-label="Movement stick"><div id="stick" class="stick"><span id="stick-knob" class="knob"></span></div></div>
      <button id="touch-interact" type="button" class="t-interact" disabled><span class="t-label"></span></button>
      <div class="pad">
        <button type="button" class="t-btn t-main" data-ability="slash" data-i18n-aria="ab.slash" aria-label="Sunblade"><span class="ability-symbol"></span></button>
        <button type="button" class="t-btn t-dash" data-ability="dash" data-i18n-aria="ab.dash" aria-label="Dash"><span class="ability-symbol"></span></button>
        <button type="button" class="t-btn t-pulse" data-ability="pulse" data-i18n-aria="ab.pulse" aria-label="Dawn Pulse"><span class="ability-symbol"></span></button>
        <button type="button" class="t-btn t-sunbreak" data-ability="sunbreak" data-i18n-aria="ab.sunbreak" aria-label="Sunbreak"><span class="ability-symbol"></span></button>
        <button type="button" class="t-btn t-lance" data-ability="solarLance" data-i18n-aria="ab.solarLance" aria-label="Solar Lance"><span class="ability-symbol"></span></button>
      </div>
    </div>

    <footer class="actionbar">
      <button id="interact-button" type="button" class="interact" disabled><span class="interact-label"></span><kbd>F</kbd></button>
      <div class="abilities">
        <button id="slash-button" type="button" class="ability" data-ability="slash"><span class="ability-symbol"></span><span class="ability-text"><span data-i18n="ab.slash">Sunblade</span><small id="slash-cooldown"></small></span><kbd>J</kbd></button>
        <button id="dash-button" type="button" class="ability" data-ability="dash"><span class="ability-symbol"></span><span class="ability-text"><span data-i18n="ab.dash">Dash</span><small id="dash-cooldown"></small></span><kbd>␣</kbd></button>
        <button id="pulse-button" type="button" class="ability" data-ability="pulse"><span class="ability-symbol"></span><span class="ability-text"><span data-i18n="ab.pulse">Dawn Pulse</span><small id="pulse-cooldown"></small></span><kbd>E</kbd></button>
        <button id="sunbreak-button" type="button" class="ability" data-ability="sunbreak"><span class="ability-symbol"></span><span class="ability-text"><span data-i18n="ab.sunbreak">Sunbreak</span><small id="sunbreak-cooldown"></small></span><kbd>Q</kbd></button>
        <button id="lance-button" type="button" class="ability" data-ability="solarLance"><span class="ability-symbol"></span><span class="ability-text"><span data-i18n="ab.solarLance">Solar Lance</span><small id="lance-cooldown"></small></span><kbd>R</kbd></button>
      </div>
      <span id="companion-status" class="companion"></span>
    </footer>
  </section>

  <dialog id="modal" aria-labelledby="modal-title"><button id="close-modal" type="button" class="close" data-i18n-aria="common.back" aria-label="Close">×</button><p id="modal-kicker" class="eyebrow"></p><h2 id="modal-title"></h2><div id="modal-body" class="modal-body"></div><div id="modal-actions" class="modal-actions"></div></dialog>
  <p id="audio-status" class="sr-only" aria-live="polite"></p>
  <script type="module" src="app/ui/game.mjs"></script>
</body>
</html>
